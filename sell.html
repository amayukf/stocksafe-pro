<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sell Product - StockSafe Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-title-box">
                <button class="back-btn" onclick="window.location.href='index.html'">&larr;</button>
                <h1>Sell Product</h1>
            </div>
            <div class="header-right">
                <span id="store-name" class="store-badge">Main Store</span>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <div class="form-group">
                <label for="search-product">Search or Scan Product</label>
                <input type="text" id="search-product" placeholder="Type product name, category or barcode..." oninput="searchProducts(this.value)">
            </div>

            <div id="search-results" class="search-results"></div>

            <div id="selected-product" class="selected-product-box" style="display:none;">
                <h3 id="selected-name">Product Name</h3>
                <p style="margin-top:4px; font-size:0.8rem;">
                    Available: <strong id="selected-stock" style="color:var(--accent);">0</strong> &nbsp;|&nbsp;
                    Price: <strong id="selected-price" style="color:var(--green);">0.00</strong> ETB
                </p>

                <div class="form-group" style="margin-top:12px;">
                    <label for="sell-quantity">Quantity to Sell</label>
                    <input type="number" id="sell-quantity" min="1" value="1" class="form-control">
                </div>

                <button type="button" onclick="processSale()" class="btn btn-success btn-block">
                    Confirm Sale
                </button>
            </div>

            <button type="button" id="scan-sell-btn" class="btn btn-primary btn-block" style="margin-top:16px;">
                Scan Barcode to Sell
            </button>
            <button type="button" id="stop-scan-sell-btn" class="btn btn-danger btn-block" style="display:none; margin-top:8px;">
                Stop Camera
            </button>
            <div id="scanner-sell-container" style="display:none; margin-top:10px;"></div>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item" onclick="window.location.href='index.html'"><span class="icon">&#x2302;</span><span>Home</span></button>
        <button class="nav-item" onclick="window.location.href='add-product.html'"><span class="icon">+</span><span>Add</span></button>
        <button class="nav-item active" onclick="window.location.href='sell.html'"><span class="icon">$</span><span>Sell</span></button>
        <button class="nav-item" onclick="window.location.href='sales-history.html'"><span class="icon">&#x2197;</span><span>Sales</span></button>
        <button class="nav-item" onclick="window.location.href='settings.html'"><span class="icon">&#x2699;</span><span>Settings</span></button>
    </nav>

    <script src="libs/dexie.min.js"></script>
    <script src="libs/quagga.min.js"></script>
    <script src="js/db.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
